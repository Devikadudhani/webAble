[pytest]
# Keep pytest's remove-and-recreate workspace outside this OneDrive-synced
# checkout. `C:\tmp` was verified writable on the supported Windows setup.
addopts = --basetemp=C:/tmp/webable-pytest
markers =
    unit: deterministic tests that do not need Chromium or external network access
    browser_integration: Playwright tests against locally hosted fixtures; Chromium required
    external_compatibility: opt-in compatibility probes for public websites; external network required
