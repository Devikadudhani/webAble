<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usable text spacing fixture</title>
  <style>
    body { font: 16px/1.5 sans-serif; max-width: 40rem; }
    p { margin: 0 0 2em; }
    button { min-height: 36px; padding: 8px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Readable page</h1>
    <p id="first">A paragraph with comfortable line spacing and room to grow.</p>
    <p id="second">A second paragraph stays separated when spacing is increased.</p>
    <button id="continue" type="button">Continue</button>
  </main>
</body>
</html>
