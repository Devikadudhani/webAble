<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text spacing overlap fixture</title>
  <style>
    #stage { position: relative; height: 80px; }
    #first, #second { position: absolute; left: 0; margin: 0; }
    #first { top: 0; }
    #second { top: 20px; }
  </style>
</head>
<body>
  <div id="stage">
    <p id="first">First line of text</p>
    <p id="second">Second line of text</p>
  </div>
</body>
</html>
