<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text spacing clipping fixture</title>
  <style>
    #clipped {
      width: 220px;
      height: 40px;
      overflow: hidden;
      font: 16px/16px sans-serif;
    }
  </style>
</head>
<body>
  <p id="clipped" style="line-height: 16px !important; margin-bottom: 4px !important; letter-spacing: 0.01em; word-spacing: 0.02em;">First short line<br>Second short line</p>
</body>
</html>
