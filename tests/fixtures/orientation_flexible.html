<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orientation-flexible content</title>
  <style>
    body { font: 16px sans-serif; margin: 0; }
    main { padding: 24px; }
    .content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    section { padding: 16px; border: 1px solid #777; }
    @media (orientation: portrait) {
      header { padding-block: 12px; }
    }
    @media (orientation: landscape) {
      header { padding-block: 4px; }
    }
  </style>
</head>
<body>
  <header><h1>Account overview</h1></header>
  <main>
    <div class="content">
      <section>
        <h2>Profile</h2>
        <p id="profile">Your profile details are available in either orientation.</p>
        <button id="edit">Edit profile</button>
      </section>
      <section>
        <h2>Notifications</h2>
        <p id="notifications">Manage notifications without rotating to a specific view.</p>
        <a id="settings" href="#settings">Open settings</a>
      </section>
    </div>
  </main>
</body>
</html>
