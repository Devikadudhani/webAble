<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Adequate non-text contrast sample</title>
  <style>
    body { font: 16px sans-serif; background: #fff; padding: 24px; }
    button {
      padding: 12px;
      color: #fff;
      background: #000;
      border: 2px solid #000;
    }
  </style>
</head>
<body>
  <button id="high-contrast-control">High contrast control</button>
  <svg width="40" height="40" aria-label="High contrast graphic">
    <circle id="high-contrast-circle" cx="20" cy="20" r="16" fill="#000"></circle>
  </svg>
</body>
</html>
