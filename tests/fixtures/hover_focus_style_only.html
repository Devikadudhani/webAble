<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ordinary hover styling</title>
  <style>
    body { font: 16px sans-serif; padding: 24px; }
    button:hover { color: #b00020; background: #ffe0e0; }
    button:focus { outline: 3px solid #005fcc; }
  </style>
</head>
<body>
  <button id="styled">A style-only button</button>
  <p>There is no extra content revealed by the hover or focus change.</p>
</body>
</html>
