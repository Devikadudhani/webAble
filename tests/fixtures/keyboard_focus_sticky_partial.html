<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sticky header focus overlap fixture</title>
  <style>
    #sticky-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      z-index: 10;
      background: #111;
    }
    #covered {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 120px;
      height: 50px;
    }
  </style>
</head>
<body>
  <header id="sticky-header">Navigation</header>
  <button id="covered" type="button">Partially covered control</button>
</body>
</html>
